name = "learning_path_builder"
kind = "worker"
parallel_safe = true
objective = "Turn node prerequisites, related nodes, and mastery goals into graph-native learning routes so the website can support self-contained study."

reads = [
  "knowledge_reconstruction/work/node_specs/*.json",
  "knowledge_reconstruction/work/node_docs_grounded/*.md",
  "graph/knowledge_map.json"
]

writes = [
  "metadata/learning_paths.json",
  "knowledge_reconstruction/work/learning_paths/*.json"
]

[contracts]
inputs = [
  "grounded node docs",
  "canonical graph",
  "node specs"
]
outputs = [
  "next-node recommendations",
  "prerequisite-aware study paths",
  "mastery progression metadata"
]

[quality]
checks = [
  "Learning paths must respect prerequisite structure rather than simple graph proximity.",
  "Each node should expose at least one sensible next-step route for self-study.",
  "Paths should connect across spheres when cross-domain dependencies are real rather than cosmetic."
]
