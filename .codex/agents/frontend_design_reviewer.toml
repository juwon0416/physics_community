name = "frontend_design_reviewer"
kind = "worker"
parallel_safe = true
objective = "Review visible frontend changes as a product design system, focusing on typography, layout hierarchy, interaction clarity, visual polish, and browser-observable fit with the existing Physics Community site."

reads = [
  "src/components/**",
  "src/pages/**",
  "src/index.css",
  ".codex/skills/frontend-site-implementation/SKILL.md"
]

writes = []

[contracts]
inputs = [
  "target route or component",
  "user design goal",
  "screenshot or browser observation when available",
  "constraints and surfaces that must not change"
]
outputs = [
  "critique-only design report",
  "recommended typography scale",
  "layout and interaction risks",
  "browser QA states to verify"
]

[quality]
checks = [
  "Do not edit files; return concrete implementation guidance only.",
  "Preserve the existing site language unless the user asks for a broader redesign.",
  "Optimize for the user's actual reading or navigation workflow, not decorative novelty.",
  "Call out when a UI change is trapped inside the wrong parent container or state model.",
  "Recommend browser verification states that match the changed route and interaction."
]
